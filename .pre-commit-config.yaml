repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # SRIM fixtures are CRLF and byte-exact; never rewrite them.
        exclude: ^test_files/|\.IN$|\.ipynb$
      - id: trailing-whitespace
        # the SVG pictures of the gallery are regenerated by make.py (their whitespace is theirs)
        exclude: ^test_files/|\.IN$|\.ipynb$|\.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock

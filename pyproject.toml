[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysrim2"
version = "0.6.0.dev0"
description = "Automation of SRIM (Stopping and Range of Ions in Matter) tasks via Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Chris Ostrouchov" },
    { name = "Arun Persaud" },
]
keywords = ["material", "srim", "automation", "plotting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy",
    "pyyaml",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/FSIBT/pysrim2"
Repository = "https://github.com/FSIBT/pysrim2"
Issues = "https://github.com/FSIBT/pysrim2/issues"
Docs = "https://pysrim2.readthedocs.io"
Changelog = "https://github.com/FSIBT/pysrim2/blob/main/CHANGELOG.md"
Original = "https://gitlab.com/costrouc/pysrim"

[tool.hatch.build.targets.wheel]
packages = ["srim"]

[tool.hatch.build.targets.sdist]
exclude = [
    "examples/images",
    "test_files",
    "docs/paper",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    "pre-commit",
]
docs = [
    "sphinx",
    "furo",
    "myst-parser",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

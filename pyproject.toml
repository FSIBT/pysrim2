[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysrim2"
version = "0.8.0"
description = "Automation of SRIM (Stopping and Range of Ions in Matter) tasks via Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Chris Ostrouchov" },
    { name = "Arun Persaud" },
]
keywords = ["material", "srim", "automation", "plotting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy",
    "pyyaml",
    "pandas",
]

[project.optional-dependencies]
parquet = ["pyarrow"]
hdf5 = ["tables"]
all = ["pysrim2[parquet,hdf5]"]

[project.scripts]
pysrim2 = "srim.cli:main"

[project.urls]
Homepage = "https://github.com/FSIBT/pysrim2"
Repository = "https://github.com/FSIBT/pysrim2"
Issues = "https://github.com/FSIBT/pysrim2/issues"
Docs = "https://pysrim2.readthedocs.io"
Changelog = "https://github.com/FSIBT/pysrim2/blob/main/CHANGELOG.md"
Original = "https://gitlab.com/costrouc/pysrim"

[tool.hatch.build.targets.wheel]
packages = ["srim"]

[tool.hatch.build.targets.wheel.force-include]
"skills/pysrim2" = "srim/_skill"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/CLAUDE.md",
    "/docs/paper",
    "/docs/superpowers",
    "/examples/images",
    "/test_files",
    "/tests",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "matplotlib",
    "nbclient",
    "ipykernel",
    "nbformat",
    "pysrim2[parquet,hdf5]",
]
docs = [
    "sphinx",
    "furo",
    "myst-parser",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not srim'"
markers = ["srim: runs the real SRIM programs (needs SRIM; run with pytest -m srim)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["test_files", "examples/notebooks", "docs/paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "PD"]

# Pre-existing findings that are not fixed in the formatting commit. Each entry needs a
# follow-up.
[tool.ruff.lint.per-file-ignores]
"srim/__init__.py" = ["F401"]  # TODO(pysrim2): tighten (intentional re-exports; add __all__)
"srim/core/__init__.py" = ["F401"]  # TODO(pysrim2): tighten (intentional re-exports; add __all__)
"srim/core/utils.py" = ["E731"]  # TODO(pysrim2): tighten (lambdas -> def)
"srim/core/layer.py" = ["E501"]  # TODO(pysrim2): tighten (wrap long lines)
"srim/core/material.py" = ["E501"]  # TODO(pysrim2): tighten (wrap long lines)
"srim/input.py" = ["E501", "UP032"]  # TODO(pysrim2): tighten (wrap lines, f-strings)
"srim/output/__init__.py" = ["F401"]  # re-exports (helpers are not in __all__)
"srim/output/_common.py" = ["E501", "F841"]  # TODO(pysrim2): tighten (unused header)
"srim/output/sr.py" = ["E501"]  # TODO(pysrim2): tighten (wrap long regex)
"srim/plot.py" = ["F841"]  # TODO(pysrim2): tighten (unused dx)
"srim/srim.py" = ["E501"]  # TODO(pysrim2): tighten (wrap long lines)
"tests/test_output.py" = ["E711"]  # TODO(pysrim2): tighten (== None -> is None)
"tests/test_srim.py" = ["F841"]  # TODO(pysrim2): tighten (unused locals)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysrim2"
version = "0.11.0"
description = "Automation of SRIM (Stopping and Range of Ions in Matter) tasks via Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Chris Ostrouchov" },
    { name = "Arun Persaud" },
    { name = "Allentro" },
    { name = "Angus Hollands" },
    { name = "Anton Såmark-Roth" },
    { name = "George Apostolopoulos" },
    { name = "Jan Mayer" },
    { name = "Jesse Carter" },
    { name = "lievcm" },
    { name = "Mirochill" },
    { name = "MrRobot2211" },
    { name = "Peter Sun" },
    { name = "philis-johan" },
    { name = "SimonF24" },
]
keywords = ["material", "srim", "automation", "plotting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy",
    "pyyaml",
    "pandas",
]

[project.optional-dependencies]
parquet = ["pyarrow"]
hdf5 = ["tables"]
plot = ["matplotlib"]
# live views of `pysrim2 scan run --ui plot|dashboard|web` (plot: textual-plotext; web: textual-serve)
tui = ["textual>=0.86.2", "textual-plotext>=1.0.1", "textual-serve>=1.1.3"]
# the desktop app (`pysrim2 app`); installed by `pysrim2 install app`
app = ["PySide6-Essentials>=6.8", "matplotlib"]
all = ["pysrim2[parquet,hdf5,plot,tui]"]

[project.scripts]
pysrim2 = "srim.cli:main"

[project.urls]
Homepage = "https://github.com/FSIBT/pysrim2"
Repository = "https://github.com/FSIBT/pysrim2"
Issues = "https://github.com/FSIBT/pysrim2/issues"
Docs = "https://pysrim2.readthedocs.io"
Changelog = "https://github.com/FSIBT/pysrim2/blob/main/CHANGELOG.md"
Original = "https://gitlab.com/costrouc/pysrim"

[tool.hatch.build.targets.wheel]
packages = ["srim"]

[tool.hatch.build.targets.wheel.force-include]
"skills/pysrim2" = "srim/_skill"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/CLAUDE.md",
    "/docs/paper",
    "/docs/superpowers",
    "/examples/images",
    "/test_files",
    "/tests",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "matplotlib",
    "nbclient",
    "ipykernel",
    "nbformat",
    # PySide6 breaks Python 3.15's lazy imports (e.g. concurrent.futures) once it is imported,
    # and pytest-qt imports it when pytest starts; 3.15 tests the library without the app
    "pysrim2[parquet,hdf5,tui,app]; python_version < '3.15'",
    "pysrim2[parquet,hdf5,tui]; python_version >= '3.15'",
    "pytest-qt>=4.4; python_version < '3.15'",
]
docs = [
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-design>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not srim and not container'"
markers = [
    "srim: runs the real SRIM programs (needs SRIM; run with pytest -m srim)",
    "container: runs pysrim2 in a container image (needs podman or docker and PYSRIM2_IMAGE; run with pytest -m container)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["test_files", "examples/notebooks", "docs/paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "PD"]

# Pre-existing findings that are not fixed in the formatting commit. Each entry needs a
# follow-up.
[tool.ruff.lint.per-file-ignores]
"srim/__init__.py" = ["F401"]  # TODO(pysrim2): tighten (intentional re-exports; add __all__)
"srim/core/__init__.py" = ["F401"]  # TODO(pysrim2): tighten (intentional re-exports; add __all__)
"srim/core/utils.py" = ["E731"]  # TODO(pysrim2): tighten (lambdas -> def)
"srim/core/layer.py" = ["E501"]  # TODO(pysrim2): tighten (wrap long lines)
"srim/core/material.py" = ["E501"]  # TODO(pysrim2): tighten (wrap long lines)
"srim/input.py" = ["E501", "UP032"]  # TODO(pysrim2): tighten (wrap lines, f-strings)
"srim/output/__init__.py" = ["F401"]  # re-exports (helpers are not in __all__)
"srim/output/_common.py" = ["E501", "F841"]  # TODO(pysrim2): tighten (unused header)
"srim/output/sr.py" = ["E501"]  # TODO(pysrim2): tighten (wrap long regex)
"srim/plot.py" = ["F841"]  # TODO(pysrim2): tighten (unused dx)
"srim/srim.py" = ["E501"]  # TODO(pysrim2): tighten (wrap long lines)
"tests/test_output.py" = ["E711"]  # TODO(pysrim2): tighten (== None -> is None)
"tests/test_srim.py" = ["F841"]  # TODO(pysrim2): tighten (unused locals)

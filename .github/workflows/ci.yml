name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Run pre-commit on all files
        run: uv run --group dev pre-commit run --all-files --show-diff-on-failure

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install the libraries the Qt offscreen platform needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Run tests with coverage
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv run --python "$PYTHON_VERSION" pytest --cov=srim --cov-report=xml --cov-fail-under=70

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install the docs group
        run: uv sync --frozen --group docs

      - name: Build the docs with warnings as errors
        run: uv run --group docs sphinx-build -W -b html docs _build/html

  srim-linux:
    name: srim-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install wine and its helpers
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32:i386 xvfb xauth 7zip cabextract unzip curl

      - name: Install SRIM under wine
        run: uv run pysrim2 install wine srim --yes

      - name: Run TRIM and SR for real
        env:
          PYSRIM2_REPRO_LABEL: linux-wine
          PYSRIM2_REPRO_OUT: ${{ github.workspace }}/repro-digest.txt
        run: uv run pytest -m srim -v

      - name: Upload the reproducibility digest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-linux
          path: repro-digest.txt
          if-no-files-found: warn

  srim-windows:
    name: srim-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install SRIM and its Visual Basic runtime
        run: uv run pysrim2 install vb5 srim --yes

      - name: Run TRIM and SR for real
        env:
          PYSRIM2_REPRO_LABEL: windows-native
          PYSRIM2_REPRO_OUT: ${{ github.workspace }}/repro-digest.txt
        run: uv run pytest -m srim -v

      - name: Upload the reproducibility digest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-windows
          path: repro-digest.txt
          if-no-files-found: warn

  # Informational only: cross-platform identity is not guaranteed (wine versus native
  # Windows), so this job reports and always succeeds. The container workflow uploads its
  # own digest in a separate workflow run, so only linux and windows are compared here.
  repro-report:
    name: repro-report
    needs: [srim-linux, srim-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the digests
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-*
          path: digests

      - name: Compare the digests
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "## Reproducibility across platforms (informational)"
            echo
            echo "| platform | digest | mean depth (A) | ions | identical to first? |"
            echo "|---|---|---|---|---|"
            first=""
            for f in digests/*/repro-digest.txt; do
              [ -f "$f" ] || continue
              label=$(sed -n 's/^label: //p' "$f")
              digest=$(sed -n 's/^digest: //p' "$f")
              depth=$(sed -n 's/^mean_depth_A: //p' "$f")
              ions=$(sed -n 's/^n_ions: //p' "$f")
              [ -n "$first" ] || first="$digest"
              if [ "$digest" = "$first" ]; then same=yes; else same=no; fi
              echo "| $label | \`${digest:0:16}\` | $depth | $ions | $same |"
            done
            echo
            echo "Same-platform reruns must match (the test asserts it); a difference between platforms is reported, never an error."
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit 0
